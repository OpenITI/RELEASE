    Epistles 41–111 of the Rasāʾil al-Ḥikma. Problematic 'edition', for the
    political and historical context,
    see Daniel de Smet, Les Epitres sacrées des Druzes, pp. 16–17:
    "Or, en l’an 1400 de l’hégire (1979–1980), date hautement symbolique,
    fut imprimé au Liban, en pleine guerre civile, en un lieu fictif appelé
    Diyār ʿAql (les “Demeures de l’Intellect”), le texte complet des Rasa'il
    al-Hikma. Les trois volumes de cette édition anonyme portent le numéro
    7 d’une série nommée Silsilat al-ḥaqīqa ṣ-ṣaʿba (“Série de la Vérité
    difficile”), diffusée par une maison d’édition elle aussi fictive, au nom
    étrange mais évocateur: Dār li-aǧl al-maʿrifa (“Maison au service de la
    sagesse”), à la fois une allusion au culte du Veau (ʿiǧl) dont les Druzes
    sont souvent accusés par leurs ennemis. Cette même série comprend en
    outre deux essais sur les Druzes d’un certain Anwar Yāsīn, auteur qui
    publia plusieurs volumes dans une série similaire bilingue, entièrement
    consacrée aux Druzes et aux Nuṣayrīs, et parue soi-disant à Paris: Al-
    adyān as-sirrīya / Collection “Esôterikos”. Si le nom de cet auteur
    sonne musulman, il s’agit en fait d’un pseudonyme, derrière lequel se
    cache le père maronite Joseph Azzi.
    Les deux séries d'essais et l'édition des Rasāʾil al-Ḥikma semblent
    avoir été diffusées par l’Université Saint-Esprit de Kaslik, dans l’inten-
    tion de présenter les Druzes comme des musulmans apostats. Si les es-
    sais contiennent des informations valables, leur ton s’avère hautement
    polémique et l’ensemble doit être utilisé avec prudence. Les Druzes ont
    ressenti ces publications comme une offensive particulièrement haineuse
    à leur égard, une attaque directe dans une guerre où tous les coups
    étaient permis. Ils prétendent dès lors que l’éditeur des Rasāʾil a délibé-
    rément falsifié les textes sacrés. Aussi, dès la fin de la guerre, l’état li-
    banais interdit les deux séries ainsi que l’édition, et confisqua l’ensem-
    ble des volumes restants. Mais un nombre inconnu d’exemplaires en fut
    diffusé, y compris parmi les Druzes non-initiés, heureux d’avoir enfin
    entre les mains les textes qui leur sont théoriquement interdits.
    Le texte imprimé par le Père Azzi, s’il ne comporte pas de “falsifica-
    tions” délibérées, n’a rien d’une édition critique. Il s’agit simplement
    d’une copie dactylographiée d’un manuscrit non spécifié et offrant un
    texte beaucoup moins fiable que n’importe quel manuscrit druze. En ef-
    fet, l’”éditeur” y a introduit de nombreuses fautes de frappe et des er-
    reurs de lecture, dues à l’inadvertence et à l’ignorance des doctrines ex
    posées.
    Sa valeur est donc très limitée pour l’élaboration d’une édition critique.
    Nous n’y ferons référence qu’occasionnellement.
    L’“offensive maronite”, si elle a eu le mérite de produire une version imprimée
    des Rasāʾil et à rendre la taqīya dorénavant inutile, a beaucoup gêné
    le développement des études druzes, surtout à cause du contexte idéologique
    et politique dans lequel elle fut menée. L’élaboration d’une édition et d’une
    traduction
    critiques, suivant des critères scientifiques et dépourvue de toute intention
    polémique,
    en est devenue d’autant plus urgente et nécessaire."
